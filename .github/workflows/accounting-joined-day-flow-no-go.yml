name: EasyStore Joined Purchase-Sale-Collection-Close Diagnostic (NO_GO)

on:
  pull_request:

permissions:
  contents: read

jobs:
  joined-accounting-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only checkout of tested TrendOS ACC228+ACC214 original T12 and native invoice Worker (immutable SHA)
        uses: actions/checkout@v4
        with:
          repository: fawakhry/TrendOs
          ref: b64fe1d4574fb9b5360e7ec51c837a5be1399805
          path: native-trendos-acc214
          persist-credentials: false
          sparse-checkout: |
            cloudflare-d1
            tests
      - name: Execute ACTUAL native finance Worker on disposable SQLite, no Cloudflare/Google access
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
          FINANCE_RELEASE: NO_GO
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test "$FINANCE_RELEASE" = "NO_GO"
          (
            cd native-trendos-acc214
            test "$(git rev-parse HEAD)" = "b64fe1d4574fb9b5360e7ec51c837a5be1399805"
            node --check cloudflare-d1/src/employee-accounting-native-v1.mjs
            node --test tests/easystore_acc213_wael_gaber_customer_invoice_native_sqlite_no_go.test.mjs
            node --check cloudflare-d1/src/t12-order-customer-finance-fence-sourceonly.mjs
            node --check tests/t12_order_customer_finance_fence_sourceonly.test.mjs
            node --test tests/t12_order_customer_finance_fence_sourceonly.test.mjs
            node --check cloudflare-d1/src/t12-official-customer-selection-session-sourceonly.mjs
            node --check cloudflare-d1/src/t12-general-create.mjs
            node --check tests/t12_general_create.test.mjs
            node --test tests/t12_general_create.test.mjs
            node --check cloudflare-d1/src/t12-employee-order-finance-intake-sourceonly.mjs
            node --test tests/t12_employee_order_finance_intake_sourceonly_acc228.test.mjs
            echo 'ACC228_SOURCE_ONLY_EMPLOYEE_ORDER_TO_EXISTING_FINANCE_HANDOFF=REVIEW_ONLY'
            echo 'ACC228_SOURCE_CAPTURE_UNVERIFIED_CUSTOMER_OWNER=YES'
            test -f cloudflare-d1/migrations/0035_t12_order_customer_at_create_sourceonly_v1.sql
            echo 'ACC223_REAL_T12_ATOMIC_SOURCE_CAPTURE_IN_ISOLATED_SQLITE=PASS'
            echo 'ACC223_NEW_ROUTER_FOR_REAL_FINANCE=NO'
            echo 'ACC223_PRODUCTION_FINANCIAL_WRITES=OFF'
            echo 'ACC222_PINNED_PLATFORM_CUSTOMER_FINANCE_FENCE=PASS'
            echo 'ACC222_REAL_OFFICIAL_ORDER_CUSTOMER_FK=NOT_ATTESTED'
          )
          node --check tests/acc221_t12_official_customer_fk_source_no_go.test.cjs
          node --test tests/acc221_t12_official_customer_fk_source_no_go.test.cjs
          echo 'ACC221_REAL_PINNED_TRENDOS_SCHEMA_OFFICIAL_FK_UNATTESTED=YES'
          echo 'ACC221_ORDER_CUSTOMER_MONEY_AUTHORITY=NO_GO'
          echo 'EASYSTORE_TRENDOS_PINNED_REAL_WORKER_FAKE_INVOICE=PASS'
          echo 'FINANCE_REAL_CLOUD_OR_PROD_WRITE=NOT_ATTEMPTED'
          echo 'EASYSTORE_SEPARATE_CLOUD_DEPLOYMENT=NOT_VERIFIED'
      - name: Read-only checkout of original TrendOS sealed-draft → T12 operational reconciliation (immutable Entry683 SHA)
        uses: actions/checkout@v4
        with:
          repository: fawakhry/TrendOs
          ref: fca5625e53815647addc6d183ebe4040990acdf5
          path: native-trendos-entry683
          persist-credentials: false
          sparse-checkout: |
            cloudflare-d1
            tests
      - name: Verify operational customer draft → canonical T12 source readback, never financial posting
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
          FINANCE_RELEASE: NO_GO
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test "$FINANCE_RELEASE" = "NO_GO"
          (
            cd native-trendos-entry683
            test "$(git rev-parse HEAD)" = "fca5625e53815647addc6d183ebe4040990acdf5"
            node --check cloudflare-d1/src/customer-portal-native-seal-t12-link-read-v0.mjs
            node --test tests/entry683_customer_seal_t12_operational_link_off.test.mjs
            python3 tests/entry683_customer_seal_t12_operational_link_sqlite.test.py -v
            test -f cloudflare-d1/migrations/0039_customer_portal_native_draft_seal_v1.sql
            echo 'ACC227_T12_DRAFT_LINK_IMMUTABLE_SOURCE_TEST=PASS'
            echo 'ACC227_PROD_ORDER_TO_NATIVE_CUSTOMER_FK=NOT_ATTESTED'
            echo 'ACC227_CUSTOMER_INVOICE_AUTOMATIC_HANDOFF=NOT_DEPLOYED'
            echo 'ACC227_SEPARATE_TRENDOS_BRANCHES_INTEGRATED=NO'
            echo 'ACC227_ORDER_CREATION_OR_EASYSTORE_FINANCE_WRITES=ZERO'
          )
      - name: Run actual old EasyStore handler integrations only against fake in-memory data
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          node --check tests/accounting_joined_day_flow_offline.test.cjs
          node --test tests/accounting_joined_day_flow_offline.test.cjs
          node --check scripts/easystore_finance_intake_preview_no_go.cjs
          node --check tests/easystore_finance_intake_preview_no_go.test.cjs
          node --test tests/easystore_finance_intake_preview_no_go.test.cjs
          node --check tests/acc219_isolated_signed_cross_cloud_http_no_go.test.cjs
          node --test tests/acc219_isolated_signed_cross_cloud_http_no_go.test.cjs
          node --check tests/acc220_live_public_finance_route_readonly_no_go.test.cjs
          node --test tests/acc220_live_public_finance_route_readonly_no_go.test.cjs
          node --check scripts/easystore_cloudflare_provider_inventory_readonly.cjs
          node --check tests/acc225_easystore_cloudflare_provider_inventory_readonly.test.cjs
          node --test tests/acc225_easystore_cloudflare_provider_inventory_readonly.test.cjs
          echo 'ACC225_PROVIDER_INVENTORY_GET_ONLY_FAKE_API_CONTRACT=PASS'
          echo 'ACC225_PROVIDER_ACTUAL_ACCESS_AND_STAGE=NOT_ATTESTED'
          echo 'ACC220_PUBLIC_RUNTIME_FINANCE_HEALTH_GET_ONLY=QUALIFIED'
          echo 'ACC220_EASYSTORE_INDEPENDENT_WORKER_D1_UNVERIFIED=YES'
          echo 'ACC219_FAKE_ONLY_SIGNED_HTTP_BETWEEN_LOCAL_LOOPBACK_SERVICES=PASS'
          echo 'ACC219_EASYSTORE_INDEPENDENT_REAL_CLOUD_CONNECTOR=NOT_DEPLOYED'
          echo 'ACC219_REAL_FINANCIAL_WRITES=ZERO'
          echo 'CROSS_CLOUD_ORDER_CUSTOMER_FINANCE_INTAKE=FAKE_ONLY_PREVIEW'
          echo 'CROSS_CLOUD_OFFICIAL_ORDER_FK_LIVE_PROOF=NOT_VERIFIED'
          echo 'EASYSTORE_SEPARATE_CLOUD_DEPLOYMENT=NOT_VERIFIED'
          echo 'JOINED_ACCOUNTING_OLD_HANDLERS_FAKE_VM_TESTED=YES'
          echo 'JOINED_ACCOUNTING_D1_WORKER_ACCEPTANCE=NOT_TESTED'
          echo 'JOINED_ACCOUNTING_CUSTOMER_CREDIT_SNAPSHOT_RECONCILIATION=OPEN'
          echo 'JOINED_ACCOUNTING_ACTUAL_PRODUCTION_JOB_COST=UNVERIFIED'
          echo 'JOINED_ACCOUNTING_FINANCE_RELEASE=NO_GO'
