name: EasyStore Joined Purchase-Sale-Collection-Close Diagnostic (NO_GO)

on:
  pull_request:

permissions:
  contents: read

jobs:
  joined-accounting-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only checkout of tested TrendOS ACC214 native Worker and fake invoice test (immutable SHA)
        uses: actions/checkout@v4
        with:
          repository: fawakhry/TrendOs
          ref: f852bb9314588f595c5aa019797953d8726ed3e2
          path: native-trendos-acc214
          persist-credentials: false
          sparse-checkout: |
            cloudflare-d1
            tests
      - name: Execute ACTUAL native finance Worker on disposable SQLite, no Cloudflare/Google access
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
          FINANCE_RELEASE: NO_GO
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test "$FINANCE_RELEASE" = "NO_GO"
          (
            cd native-trendos-acc214
            test "$(git rev-parse HEAD)" = "f852bb9314588f595c5aa019797953d8726ed3e2"
            node --check cloudflare-d1/src/employee-accounting-native-v1.mjs
            node --test tests/easystore_acc213_wael_gaber_customer_invoice_native_sqlite_no_go.test.mjs
          )
          node --check tests/acc221_t12_official_customer_fk_source_no_go.test.cjs
          node --test tests/acc221_t12_official_customer_fk_source_no_go.test.cjs
          echo 'ACC221_REAL_PINNED_TRENDOS_SCHEMA_OFFICIAL_FK_UNATTESTED=YES'
          echo 'ACC221_ORDER_CUSTOMER_MONEY_AUTHORITY=NO_GO'
          echo 'EASYSTORE_TRENDOS_PINNED_REAL_WORKER_FAKE_INVOICE=PASS'
          echo 'FINANCE_REAL_CLOUD_OR_PROD_WRITE=NOT_ATTEMPTED'
          echo 'EASYSTORE_SEPARATE_CLOUD_DEPLOYMENT=NOT_VERIFIED'
      - name: Run actual old EasyStore handler integrations only against fake in-memory data
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          node --check tests/accounting_joined_day_flow_offline.test.cjs
          node --test tests/accounting_joined_day_flow_offline.test.cjs
          node --check scripts/easystore_finance_intake_preview_no_go.cjs
          node --check tests/easystore_finance_intake_preview_no_go.test.cjs
          node --test tests/easystore_finance_intake_preview_no_go.test.cjs
          node --check tests/acc219_isolated_signed_cross_cloud_http_no_go.test.cjs
          node --test tests/acc219_isolated_signed_cross_cloud_http_no_go.test.cjs
          node --check tests/acc220_live_public_finance_route_readonly_no_go.test.cjs
          node --test tests/acc220_live_public_finance_route_readonly_no_go.test.cjs
          echo 'ACC220_PUBLIC_RUNTIME_FINANCE_HEALTH_GET_ONLY=QUALIFIED'
          echo 'ACC220_EASYSTORE_INDEPENDENT_WORKER_D1_UNVERIFIED=YES'
          echo 'ACC219_FAKE_ONLY_SIGNED_HTTP_BETWEEN_LOCAL_LOOPBACK_SERVICES=PASS'
          echo 'ACC219_EASYSTORE_INDEPENDENT_REAL_CLOUD_CONNECTOR=NOT_DEPLOYED'
          echo 'ACC219_REAL_FINANCIAL_WRITES=ZERO'
          echo 'CROSS_CLOUD_ORDER_CUSTOMER_FINANCE_INTAKE=FAKE_ONLY_PREVIEW'
          echo 'CROSS_CLOUD_OFFICIAL_ORDER_FK_LIVE_PROOF=NOT_VERIFIED'
          echo 'EASYSTORE_SEPARATE_CLOUD_DEPLOYMENT=NOT_VERIFIED'
          echo 'JOINED_ACCOUNTING_OLD_HANDLERS_FAKE_VM_TESTED=YES'
          echo 'JOINED_ACCOUNTING_D1_WORKER_ACCEPTANCE=NOT_TESTED'
          echo 'JOINED_ACCOUNTING_CUSTOMER_CREDIT_SNAPSHOT_RECONCILIATION=OPEN'
          echo 'JOINED_ACCOUNTING_ACTUAL_PRODUCTION_JOB_COST=UNVERIFIED'
          echo 'JOINED_ACCOUNTING_FINANCE_RELEASE=NO_GO'
