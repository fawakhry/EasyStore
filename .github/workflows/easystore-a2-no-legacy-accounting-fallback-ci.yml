name: EasyStore A2 No Legacy Accounting Fallback CI

on:
  push:
    branches:
      - candidate/easystore-zero-google-audit-20261004
    paths:
      - 'app.js'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node tests/easystore_a2_write_router.test.js
      - run: node tests/easystore_a2_no_legacy_accounting_fallback.test.js
      - run: |
          echo EASYSTORE_A2_NO_LEGACY_ACCOUNTING_FALLBACK_CI=PASS
          echo PRODUCTION_MUTATION=NO
