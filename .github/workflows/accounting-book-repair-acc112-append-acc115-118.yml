          for block in entries:
              marker=block.split(' — ',1)[0].replace('## Entry ','')
              if ('## Entry '+marker+' ') not in s:
                  s += '\n\n'+block.strip()+'\n'

          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EASYSTORE_ACCOUNTING_MASTER_BOOK.md
          git commit -m "ACC-112 ACC-115-118: complete A2.11 Waste history" || exit 0
          git push origin HEAD:candidate/easystore-zero-google-audit-20261004
