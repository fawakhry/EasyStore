name: EasyStore Multi-Invoice Customer Collection SQLite (SOURCE NO_GO)
on:
  pull_request:

permissions:
  contents: read

jobs:
  offline-multi-invoice-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout EasyStore (source-only; no persistence credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only checkout of pinned TrendOS native Worker and D1 migration SQL
        uses: actions/checkout@v4
        with:
          repository: fawakhry/TrendOs
          ref: 90795b9d05b3cc72051be50683c7942b87d07452
          path: native-trendos-pinned
          persist-credentials: false
          sparse-checkout: |
            cloudflare-d1/src
            cloudflare-d1/migrations
      - name: Use Node.js 22 native ephemeral SQLite
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual pinned native Worker with fake in-memory SQLite only
        shell: bash
        env:
          EASYSTORE_PINNED_TRENDOS_ROOT: ${{ github.workspace }}/native-trendos-pinned/cloudflare-d1
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -f "$EASYSTORE_PINNED_TRENDOS_ROOT/src/employee-accounting-native-v1.mjs"
          test -f "$EASYSTORE_PINNED_TRENDOS_ROOT/migrations/0024_employee_accounting_party_balances_v1.sql"
          node --check tests/easystore_multi_invoice_customer_collection_sqlite_no_go.test.cjs
          node --test tests/easystore_multi_invoice_customer_collection_sqlite_no_go.test.cjs
          echo 'CUSTOMER_AGGREGATE_RECEIVABLE_SQLITE=SOURCE_ONLY'
          echo 'CUSTOMER_INVOICE_ALLOCATION_POLICY=OWNER_DECISION_OPEN'
          echo 'REAL_EMPLOYEE_SSO=NOT_TESTED'
          echo 'REAL_D1_REMOTE=NOT_TOUCHED'
          echo 'FINANCE_RELEASE=NO_GO'
