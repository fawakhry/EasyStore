name: EasyStore A2 Write Router CI

on:
  push:
    branches:
      - candidate/easystore-zero-google-audit-20261004
    paths:
      - 'app.js'
      - 'config.js'
      - 'docs/ACCOUNTING_WRITE_MODEL_V1.json'
      - 'tests/easystore_a2_write_router.test.js'
      - '.github/workflows/easystore-a2-write-router-ci.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate A2 fail-closed D1 write router
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node tests/accounting_write_model_v1.test.js
          node tests/easystore_a2_write_router.test.js
          echo EASYSTORE_A2_WRITE_ROUTER_CI=PASS
          echo PRODUCTION_MUTATION=NO
