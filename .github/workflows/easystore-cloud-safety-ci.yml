name: EasyStore Cloud Safety
on:
  push:
    branches: [main, fix/easystore-cloud-readiness-20261008]
    paths: [app.js, scripts/easystore-platform.mjs, tests/easystore_platform_connection.test.mjs, tests/easystore_cloud_write_routing.test.mjs, .github/workflows/easystore-cloud-safety-ci.yml]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node tests/easystore_cloud_write_routing.test.mjs
      - run: node tests/easystore_platform_connection.test.mjs
      - run: node tests/easystore_sso_fresh_handoff.test.mjs
      - run: node tests/entry619_d1_readonly_sso.test.js
