name: EasyStore Cloud Safety
on:
  push:
    branches: [main, fix/easystore-cloud-readiness-20261008]
    paths: [app.js, tests/easystore_cloud_write_routing.test.mjs, .github/workflows/easystore-cloud-safety-ci.yml]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node tests/easystore_cloud_write_routing.test.mjs
