name: ACC208 EasyStore Native Owner READONLY Audit UI OFF NO_GO
on:
  pull_request:
permissions:
  contents: read
jobs:
  frontend-native-finance-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify D1-only owner review UI source, default OFF, no money writes
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          node --check app.js
          node --check config.js
          node tests/easystore_acc208_native_owner_forensic_ui_off_no_go.test.cjs
          node tests/easystore_a1_all_reads_d1_only.test.js
          node tests/easystore_a2_no_legacy_accounting_fallback.test.js
          echo 'ACC208_NATIVE_OWNER_READONLY_GUI=SOURCE_VERIFIED'
          echo 'ACC208_FEATURE_DEFAULT=OFF'
          echo 'ACC208_REAL_FINANCE_POSTING=NO'
