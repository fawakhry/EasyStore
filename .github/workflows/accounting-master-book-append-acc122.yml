          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('EASYSTORE_ACCOUNTING_MASTER_BOOK.md')
          s=p.read_text()
          block="""## Entry ACC-122 — A2.12 Dept Line guard deployed READONLY with zero mutation
