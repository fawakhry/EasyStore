name: EasyStore A2.13 Custody Close Frontend Qualification

on:
  push:
    branches:
      - candidate/easystore-a213-custody-close-canary-prodpatch-20261007
    paths:
      - 'app.js'
      - 'config.js'
      - 'index.html'
      - 'tests/easystore_a213_custody_close_frontend_canary.test.mjs'
      - '.github/workflows/easystore-a213-custody-close-frontend-ci.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/easystore-a213-custody-close-canary-prodpatch-20261007
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Qualify isolated zero-balance Custody Close candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node tests/easystore_a213_custody_close_frontend_canary.test.mjs
          echo A213_CUSTODY_CLOSE_FRONTEND_QUALIFICATION=PASS
          echo D1_WRITE_ACTION=closePurchaseCustodyV1920_ONLY
          echo SYNTHETIC_REQUEST_PREFIX=A213-CCLOSE
          echo SYNTHETIC_EMPLOYEE_PREFIX=A2-CANARY-CUSTODY-
          echo SYNTHETIC_WORK_DATE=2099-12-31
          echo SYNTHETIC_BALANCE=0
          echo CANDIDATE_MODE=OFF
          echo CANDIDATE_ACTIONS=[]
          echo PRODUCTION_DEPLOY=NO
          echo PRODUCTION_MUTATION=NO
