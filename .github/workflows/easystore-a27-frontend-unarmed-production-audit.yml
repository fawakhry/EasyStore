name: EasyStore A2.7 Frontend Unarmed Production Audit

on:
  push:
    branches:
      - candidate/easystore-zero-google-audit-20261004
    paths:
      - '.github/workflows/easystore-a27-frontend-unarmed-production-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Audit live EasyStore before config flip
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://fawakhry.github.io/EasyStore"
          API="https://trendos-d1-api.trendmall-contact.workers.dev"
          curl --fail --silent --show-error --location "$BASE/index.html?a27=$GITHUB_RUN_ID" > /tmp/index.html
          curl --fail --silent --show-error --location "$BASE/app.js?a27=$GITHUB_RUN_ID" > /tmp/app.js
          curl --fail --silent --show-error --location "$BASE/config.js?a27=$GITHUB_RUN_ID" > /tmp/config.js
          curl --fail --silent --show-error "$API/v1/employee/accounting/health?a27=$GITHUB_RUN_ID" > /tmp/health.json
          node <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('/tmp/index.html','utf8');
          const app=fs.readFileSync('/tmp/app.js','utf8');
          const config=fs.readFileSync('/tmp/config.js','utf8');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if(!index.includes("CACHE_TAG = 'a27-first-canary-20261006'")) throw new Error('new index cache tag not live');
          if(!index.includes('app.js?v=a27-first-canary-20261006')) throw new Error('new app query not live');
          if(!app.includes("const D1_ACCOUNTING_WRITE_ACTIONS = new Set(['saveAccountingTemplate'])")) throw new Error('one-action app code not live');
          if(!app.includes("itemName:'A2-CANARY-TEMPLATE-'+Date.now()")) throw new Error('synthetic template guard not live');
          if(/EASYSTORE_ACCOUNTING_D1_WRITE_MODE\s*=\s*'CANARY'/.test(config)) throw new Error('frontend canary armed too early');
          if(h.mode!=='READONLY') throw new Error('backend not READONLY');
          if(Number(h.writeCanaryAllowedUserCount||0)!==0||Number(h.writeCanaryAllowedActionCount||0)!==0) throw new Error('server canary already armed');
          console.log('A27_LIVE_APP_CODE=PASS');
          console.log('A27_LIVE_CACHE_TAG=PASS');
          console.log('A27_LIVE_CONFIG=UNARMED');
          console.log('A27_BACKEND_MODE=READONLY');
          console.log('A27_SERVER_ALLOWLISTS=EMPTY');
          console.log('PRODUCTION_BUSINESS_MUTATION=NO');
          NODE
