name: A2.11 Enable Waste Frontend CANARY Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/a211-enable-waste-frontend-canary-once.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Enable exact A2.11 Waste CANARY scope
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('config.js')
          s=p.read_text()
          a="window.EASYSTORE_ACCOUNTING_D1_WRITE_MODE = 'OFF';"
          b="window.EASYSTORE_ACCOUNTING_D1_WRITE_MODE = 'CANARY';"
          c="window.EASYSTORE_ACCOUNTING_D1_WRITE_CANARY_ACTIONS = [];"
          d="window.EASYSTORE_ACCOUNTING_D1_WRITE_CANARY_ACTIONS = ['saveAccountingWaste'];"
          if s.count(a)!=1 or s.count(c)!=1:
              raise SystemExit('A2.11 config anchors mismatch')
          s=s.replace(a,b,1).replace(c,d,1)
          if "window.EASYSTORE_ACCOUNTING_D1_READONLY = true;" not in s:
              raise SystemExit('D1 readonly drift')
          if "window.EASYSTORE_ACCOUNTING_D1_WRITES = false;" not in s:
              raise SystemExit('legacy writes drift')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.js
          git commit -m "A2.11: enable bounded Waste frontend CANARY"
          git push origin HEAD:main
