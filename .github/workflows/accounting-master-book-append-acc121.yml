name: Accounting Master Book Append ACC-121

on:
  push:
    branches:
      - candidate/easystore-zero-google-audit-20261004
    paths:
      - '.github/workflows/accounting-master-book-append-acc121.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/easystore-zero-google-audit-20261004
      - name: Append ACC-121 once
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('EASYSTORE_ACCOUNTING_MASTER_BOOK.md')
          s=p.read_text()
          block="""## Entry ACC-121 — Owner approval for A2.12 bounded Dept Line Production canary
          - Date: 2026-10-07
          - Owner explicitly approved proceeding from ACC-120.
          - Approved scope only: canonical actor ضياء; action saveAccountingDeptLine; one synthetic A2-CANARY-DEPT-* department-line draft; request A212-DLINE-*; item A2-CANARY-DEPT-LINE-*; department عام; qty 1; zero price/cost/value; no customer; no material; no approval; no stock movement; no cashbox; no Party ledger; max one command; short TTL; automatic return to READONLY; GENERAL forbidden.
          - Expected successful delta only: deptLines 0→1; requestLedger 5→6; events 5→6; all other tracked/protected tables invariant.
          - This approval does not itself deploy, ARM, or mutate business data.
          - Result: APPROVED — A2.12 MAY PROCEED ONLY WITHIN THE BOUNDED SCOPE ABOVE.
          """
          if '## Entry ACC-121 ' not in s:
              s += '\n\n'+block.strip()+'\n'
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+fawakhry@users.noreply.github.com"
          git add EASYSTORE_ACCOUNTING_MASTER_BOOK.md
          git commit -m "ACC-121: approve bounded A2.12 Dept Line canary" || exit 0
          git push origin HEAD:candidate/easystore-zero-google-audit-20261004
