name: EasyStore Cloudflare Secrets Readonly Check

on:
  push:
    branches:
      - agent/accounting-automation-v1921
    paths:
      - '.github/workflows/easystore-cloudflare-secrets-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cloudflare-secrets-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify required secrets exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo 'EASYSTORE_CF_SECRETS_PRESENT=PASS'

      - name: Verify Cloudflare account access read only
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/d1-list.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database")"
          echo "HTTP_STATUS=${code}"
          test "$code" = "200"
          jq -e '.success == true' /tmp/d1-list.json >/dev/null
          count="$(jq '.result | length' /tmp/d1-list.json)"
          echo "EASYSTORE_CF_D1_READONLY=PASS count=${count}"
          {
            echo '## EasyStore Cloudflare Secrets Readonly Check'
            echo
            echo '- Secrets present: **PASS**'
            echo '- Cloudflare D1 list access: **PASS**'
            echo "- D1 database count: **${count}**"
            echo '- Mutation performed: **false**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert workflow is mutation free
        shell: bash
        run: |
          set -euo pipefail
          echo 'EASYSTORE_CF_MUTATION=false'
