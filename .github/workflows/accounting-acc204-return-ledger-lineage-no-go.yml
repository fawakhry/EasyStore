name: EasyStore ACC204 Return Ledger Lineage (SOURCE ONLY NO_GO)

on:
  pull_request:

permissions:
  contents: read

jobs:
  fake-ledger-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source only, no persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-source hypothetical payment and prior compensation review
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          node --check scripts/accounting_acc204_return_ledger_lineage_no_go.cjs
          node --check tests/accounting_acc204_return_ledger_lineage_no_go.test.cjs
          node --test tests/accounting_acc204_return_ledger_lineage_no_go.test.cjs
          node --test tests/accounting_acc203_return_review_preview_no_go.test.cjs
          node --test tests/accounting_acc202_d1_action_failclosed_no_go.test.cjs
          node --test tests/accounting_acc201_sso_opener_role_no_go.test.cjs
          node tests/easystore_a2_no_legacy_accounting_fallback.test.js
          node tests/easystore_a2_write_router.test.js
          node tests/easystore_a1_all_reads_d1_only.test.js
          node tests/easystore_a1_core_read_router.test.js
          node tests/accounting_agent_policy_v1.test.js
          echo 'ACC204_FAKE_LEDGER_LINEAGE_REVIEW_ONLY=PASS'
          echo 'ACC204_REAL_LEDGER_RECORDS_VERIFIED=0'
          echo 'ACC204_REAL_FINANCIAL_POSTINGS=0'
          echo 'ACC204_FINANCE_RELEASE=NO_GO'
