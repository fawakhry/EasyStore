name: EasyStore A1 All Reads D1 Only CI

on:
  push:
    branches:
      - candidate/easystore-zero-google-audit-20261004
    paths:
      - 'app.js'
      - 'docs/ACCOUNTING_READ_MODEL_V1.json'
      - 'docs/EASYSTORE_ZERO_GOOGLE_ACTION_INVENTORY_20261004.json'
      - 'tests/easystore_a1_all_reads_d1_only.test.js'
      - '.github/workflows/easystore-a1-all-reads-d1-only-ci.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all accounting reads are D1-only
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node tests/accounting_read_model_v1.test.js
          node tests/easystore_a1_core_read_router.test.js
          node tests/easystore_a1_all_reads_d1_only.test.js
          echo EASYSTORE_A1_ALL_READS_D1_ONLY_CI=PASS
