  <title>إيزي ستور مطبعجي ES47 V1922 Unified Safe Build</title>
  <script>
  (function(){
    var LOCK_VERSION = 'ES47 V1922 Unified Safe Build';
    var CACHE_TAG = 'entry619-d1-readonly-sso2-20261004';
    window.EASYSTORE_SESSION_CATALOG_FIX = LOCK_VERSION;
    window.EASYSTORE_CACHE_TAG = CACHE_TAG;
    window.EASYSTORE_AUTO_REFRESH = 'safe-3-minutes-when-clean';
    try {
      var previousTag = localStorage.getItem('EASYSTORE_CACHE_TAG');
      if (previousTag && previousTag !== CACHE_TAG && window.caches && caches.keys) {
        caches.keys().then(function(keys){ keys.forEach(function(k){ if(/^(easystore|matbagy|trend)-/i.test(k)) caches.delete(k); }); });
      }
      localStorage.setItem('EASYSTORE_ACTIVE_BUILD', LOCK_VERSION);
      localStorage.setItem('EASYSTORE_CACHE_TAG', CACHE_TAG);
      ['EASYSTORE_LAST_VERSION','EASYSTORE_OLD_VERSION','EASYSTORE_BUILD_MIX_WARNING'].forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});
    } catch(e){}
  })();
  </script>

  <script>
  (function(){
    var LOCK_VERSION = 'ES47 V1922 Unified Safe Build';
    var SHORT_VERSION = 'ES47 V1922';
    function lockVersionText(){
      try{ document.title = 'إيزي ستور مطبعجي ' + SHORT_VERSION; }catch(e){}
      try{ window.EASYSTORE_VERSION = LOCK_VERSION; window.EASYSTORE_MATBAGY_VERSION = LOCK_VERSION; }catch(e){}
      var selectors = '.version-badge,[data-app-version]';
      document.querySelectorAll(selectors).forEach(function(el){ el.textContent = LOCK_VERSION; });
    }
    lockVersionText();
  })();
  </script>
